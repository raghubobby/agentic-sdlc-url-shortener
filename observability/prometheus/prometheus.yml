global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:8081"]

  - job_name: url-shortener
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["url-shortener:8082"]
