services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-demo-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    entrypoint: ["/bin/sh", "-c", "git config --global --add safe.directory /workspace/repo && exec java -jar /app/app.jar"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agentic
      DB_USERNAME: agentic
      DB_PASSWORD: agentic
      MODEL_PROVIDER: deterministic
      AGENTIC_FAILURE_INJECTION_ENABLED: "true"
      REPOSITORY_ROOT: /workspace/repo
      WORKSPACE_ROOT: /workspace/worktrees
      URL_SHORTENER_BASE_URL: http://url-shortener:8082
      URL_SHORTENER_PUBLIC_URL: http://localhost:8082
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace/repo
      - agentic-worktrees:/workspace/worktrees

  url-shortener:
    build:
      context: .
      dockerfile: Dockerfile.url-shortener
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      URL_DB_URL: jdbc:postgresql://postgres:5432/agentic?currentSchema=url_shortener
      URL_DB_USER: agentic
      URL_DB_PASSWORD: agentic
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SHORT_URL_BASE_URL: http://localhost:8082/r
      SHORT_URL_CACHE_ENABLED: "true"
    ports: ["8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [control-plane, url-shortener]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  postgres-demo-data:
  agentic-worktrees:
